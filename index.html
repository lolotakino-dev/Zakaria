<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة التداول المتقدمة - Neon Crypto</title>
    <style>
        :root {
            --bg-color: #080915;
            --card-bg: #111428;
            --neon-green: #00ffcc;
            --neon-red: #ff0055;
            --neon-blue: #00bfff;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--neon-blue);
            padding-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 191, 255, 0.2);
        }

        .title {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            margin: 0;
        }

        /* أزرار التبديل */
        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: #1a1e3b;
            color: #fff;
            border: 1px solid var(--neon-blue);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px var(--neon-blue);
        }

        .btn:hover, .btn.active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        /* شبكة العرض */
        .grid {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
        }

        .chart-container {
            background: var(--card-bg);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 12px;
            height: 550px;
            padding: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }

        .info-panel {
            background: var(--card-bg);
            border: 1px solid rgba(255, 0, 85, 0.3);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.1);
        }

        .card {
            background: #181c37;
            padding: 12px;
            border-radius: 8px;
            border-right: 4px solid var(--neon-green);
        }

        .card.sell {
            border-right-color: var(--neon-red);
        }

        .card h4 { margin: 0 0 5px 0; color: #aaa; font-size: 14px;}
        .card .val { font-size: 18px; font-weight: bold; }

        .neon-buy { color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green); }
        .neon-sell { color: var(--neon-red); text-shadow: 0 0 8px var(--neon-red); }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">منصة التحليل والتبديل المتقدمة ⚡</h1>
        <div id="live-clock" style="color: var(--neon-green)">--:--:--</div>
    </div>

    <!-- أزرار التبديل بين العملات -->
    <div class="controls">
        <button class="btn active" onclick="changePair('BINANCE:BTCUSDT')">بيتكوين (BTC)</button>
        <button class="btn" onclick="changePair('BINANCE:ETHUSDT')">إيثريوم (ETH)</button>
        <button class="btn" onclick="changePair('BINANCE:SOLUSDT')">سولانا (SOL)</button>
        <button class="btn" onclick="changePair('FX:EURUSD')">اليورو / دولار (EUR/USD)</button>
        <button class="btn" onclick="changePair('TVC:GOLD')">الذهب (GOLD)</button>
    </div>

    <div class="grid">
        <!-- الشاشة المتقدمة للرسم البياني -->
        <div class="chart-container">
            <div id="tradingview_chart" style="height:100%; width:100%;"></div>
        </div>

        <!-- لوحة المعلومات والتنبؤ والدعم/المقاومة -->
        <div class="info-panel">
            <div class="card">
                <h4>التنبوء والاتجاه العام</h4>
                <div class="val neon-buy" id="signal">شراء قوي (Strong Buy)</div>
                <small style="color:#888;">نسبة الثقة: 87% بناءً على المؤشرات</small>
            </div>

            <div class="card">
                <h4>مستويات الدعم (Support)</h4>
                <div class="val neon-buy">S1: <span id="s1">--</span></div>
                <div class="val neon-buy">S2: <span id="s2">--</span></div>
            </div>

            <div class="card sell">
                <h4>مستويات المقاومة (Resistance)</h4>
                <div class="val neon-sell">R1: <span id="r1">--</span></div>
                <div class="val neon-sell">R2: <span id="r2">--</span></div>
            </div>

            <div class="card">
                <h4>بيانات الشمعة اليومية</h4>
                <div style="font-size:13px; margin-top:5px;">الافتتاح: <b id="open-price">--</b></div>
                <div style="font-size:13px;">الإغلاق السابق: <b id="close-price">--</b></div>
            </div>
        </div>
    </div>

    <!-- تضمين مكتبة الرسم البياني المتقدمة من TradingView -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        let currentSymbol = 'BINANCE:BTCUSDT';

        function loadChart(symbol) {
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "D",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "ar",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tradingview_chart",
                "studies": [
                    "RSI@tv-basicstudies",
                    "MASimple@tv-basicstudies",
                    "PivotPointsHighLow@tv-basicstudies"
                ]
            });
        }

        function changePair(symbol) {
            currentSymbol = symbol;
            loadChart(symbol);
            
            // تحديث الأزرار
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // تشغيل الرسم البياني لأول مرة
        loadChart(currentSymbol);

        // تحديث الوقت
        setInterval(() => {
            document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('ar-EG');
        }, 1000);
    </script>
</body>
</html>
