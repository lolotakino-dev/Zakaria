<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Pro Engine - HTML/JS</title>
    <!-- TradingView Lightweight Charts Library -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-dark: #080915;
            --panel-bg: #111428;
            --neon-green: #00ffcc;
            --neon-red: #ff0055;
            --neon-blue: #00bfff;
            --text-color: #e1e1e6;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Navbar Header */
        .header {
            height: 50px;
            background: var(--panel-bg);
            border-bottom: 1px solid rgba(0, 191, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }

        .title {
            color: var(--neon-blue);
            font-weight: bold;
            font-size: 16px;
            text-shadow: 0 0 8px var(--neon-blue);
        }

        .symbol-selector {
            background: #181c37;
            color: #fff;
            border: 1px solid var(--neon-blue);
            padding: 5px 10px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }

        /* Layout Grid */
        .main-container {
            display: grid;
            grid-template-columns: 50px 1fr 320px;
            height: calc(100vh - 50px);
        }

        /* Sidebar Drawing Tools */
        .drawing-toolbar {
            background: var(--panel-bg);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
            gap: 15px;
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: #888;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tool-btn:hover, .tool-btn.active {
            color: var(--neon-green);
            transform: scale(1.1);
        }

        /* Chart Canvas Area */
        #chart-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Right Panel Details & Live Indicators */
        .right-panel {
            background: var(--panel-bg);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .card {
            background: #151936;
            border-radius: 8px;
            padding: 12px;
            border-right: 3px solid var(--neon-blue);
        }

        .card h4 {
            margin: 0 0 8px 0;
            font-size: 12px;
            color: #888;
        }

        .card .val {
            font-size: 18px;
            font-weight: bold;
        }

        .green { color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }
        .red { color: var(--neon-red); text-shadow: 0 0 5px var(--neon-red); }

        /* Code Editor Overlay Area */
        .code-box {
            width: 100%;
            height: 100px;
            background: #090b18;
            border: 1px solid var(--neon-blue);
            color: var(--neon-green);
            font-family: monospace;
            font-size: 11px;
            padding: 5px;
            box-sizing: border-box;
            border-radius: 4px;
            resize: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">TRADINGVIEW ENGINE V1.0 ⚡</div>
        <div>
            <select class="symbol-selector" id="pairSelect" onchange="switchPair(this.value)">
                <option value="btcusdt">BTC / USDT</option>
                <option value="ethusdt">ETH / USDT</option>
                <option value="solusdt">SOL / USDT</option>
            </select>
        </div>
    </div>

    <div class="main-container">
        <!-- شريط أدوات الرسم الجانبي -->
        <div class="drawing-toolbar">
            <button class="tool-btn" title="مؤشر الماوس">🎯</button>
            <button class="tool-btn" title="خط اتجاه (Trendline)">📏</button>
            <button class="tool-btn" title="مستويات فيبوناتشي">🌀</button>
            <button class="tool-btn" title="إضافة نص">✏️</button>
        </div>

        <!-- مساحة الرسم البياني والتحديث الحي -->
        <div id="chart-container"></div>

        <!-- اللوحة الجانبية والمؤشرات اللحظية -->
        <div class="right-panel">
            <div class="card">
                <h4>السعر اللحظي (Binance WebSocket)</h4>
                <div class="val" id="livePrice">0.00 $</div>
            </div>

            <div class="card">
                <h4>مستويات الدعم والمقاومة اليومية</h4>
                <div style="font-size: 12px; margin-bottom: 4px;">R1: <b id="r1Val" class="red">0.00</b></div>
                <div style="font-size: 12px;">S1: <b id="s1Val" class="green">0.00</b></div>
            </div>

            <div class="card">
                <h4>محرر الخوارزميات (Pine Script Engine)</h4>
                <textarea class="code-box" placeholder="// أدخل كود Pine Script هنا...
//@version=5
indicator('SMC Engine', overlay=true)
plot(close)"></textarea>
            </div>
        </div>
    </div>

    <script>
        let chart, candlestickSeries, ws;
        let currentSymbol = 'btcusdt';

        // 1. تهيئة الشارت باستعمال Lightweight Charts Engine
        function initChart() {
            const chartElement = document.getElementById('chart-container');
            chart = LightweightCharts.createChart(chartElement, {
                layout: {
                    backgroundColor: '#080915',
                    textColor: '#d1d4dc',
                },
                grid: {
                    vertLines: { color: 'rgba(42, 46, 57, 0.5)' },
                    horzLines: { color: 'rgba(42, 46, 57, 0.5)' },
                },
                timeScale: {
                    timeVisible: true,
                    secondsVisible: false,
                },
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#00ffcc',
                downColor: '#ff0055',
                borderDownColor: '#ff0055',
                borderUpColor: '#00ffcc',
                wickDownColor: '#ff0055',
                wickUpColor: '#00ffcc',
            });

            window.addEventListener('resize', () => {
                chart.resize(chartElement.clientWidth, chartElement.clientHeight);
            });
        }

        // 2. جلب البيانات التاريخية والربط السريع بـ Binance REST API
        async function loadHistoricalData(symbol) {
            const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol.toUpperCase()}&interval=1m&limit=200`);
            const data = await res.json();
            
            const cdata = data.map(d => ({
                time: d[0] / 1000,
                open: parseFloat(d[1]),
                high: parseFloat(d[2]),
                low: parseFloat(d[3]),
                close: parseFloat(d[4])
            }));

            candlestickSeries.setData(cdata);
            calculatePivotPoints(cdata);
        }

        // 3. الربط الحي بالبث المباشر للشمعات عبر WebSocket
        function connectWebSocket(symbol) {
            if (ws) ws.close();

            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@kline_1m`);
            
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                const candle = message.k;

                const liveCandle = {
                    time: candle.t / 1000,
                    open: parseFloat(candle.o),
                    high: parseFloat(candle.h),
                    low: parseFloat(candle.l),
                    close: parseFloat(candle.c)
                };

                candlestickSeries.update(liveCandle);

                // تحديث السعر واللون لحظياً
                const priceEl = document.getElementById('livePrice');
                priceEl.innerText = liveCandle.close.toFixed(2) + ' $';
                priceEl.className = liveCandle.close >= liveCandle.open ? 'val green' : 'val red';
            };
        }

        // 4. حساب مستويات الدعم والمقاومة تلقائياً
        function calculatePivotPoints(data) {
            const lastCandle = data[data.length - 1];
            const P = (lastCandle.high + lastCandle.low + lastCandle.close) / 3;
            const R1 = (2 * P) - lastCandle.low;
            const S1 = (2 * P) - lastCandle.high;

            document.getElementById('r1Val').innerText = R1.toFixed(2) + ' $';
            document.getElementById('s1Val').innerText = S1.toFixed(2) + ' $';
        }

        // 5. التبديل بين أزواج التداول
        function switchPair(symbol) {
            currentSymbol = symbol;
            loadHistoricalData(symbol);
            connectWebSocket(symbol);
        }

        // بدء التشغيل
        initChart();
        switchPair(currentSymbol);
    </script>
</body>
</html>
